spring:
  application:
    name: ledger-practice

  thymeleaf:
    cache: false

  # 預設只有 1 條排程執行緒，OutboxRelay、對帳等 @Scheduled 任務會互相排隊；
  # 其中一個卡在等外部回應時，其他任務也跟著延後。
  task:
    scheduling:
      pool:
        size: 3

  datasource:
    driver-class-name: org.h2.Driver
    username: 'sa'
    password:
    url: 'jdbc:h2:mem:my_app'

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

outbox:
  relay:
    batch-size: 100
    confirm-timeout: 5s

reconciliation:
  stale-after: 10m
  interval-ms: 60000

settlement:
  webhook:
    secret: dev-shared-secret

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
