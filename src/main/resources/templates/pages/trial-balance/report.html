<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="zh-TW">
<head>
    <title>試算平衡表</title>
</head>
<body>
<div layout:fragment="content">

    <h2>試算平衡表</h2>

    <form method="get" th:action="@{/report/trial-balance}">
        <label>結算日期（留空＝全部歷史）：
            <input type="date" name="asOfDate" th:value="${asOfDate}"/>
        </label>
        <button type="submit">查詢</button>
        <a th:if="${asOfDate != null}" th:href="@{/report/trial-balance}">清除日期</a>
    </form>

    <p th:if="${asOfDate != null}" th:text="|資料結算至：${asOfDate}|"></p>

    <table>
        <thead>
        <tr>
            <td>編號</td>
            <td>名稱</td>
            <td>類型</td>
            <td>總借額</td>
            <td>總貸額</td>
        </tr>
        </thead>
        <tbody>
        <tr th:each="balance : ${balances}">
            <td th:text="${balance.accountCode}">1101</td>
            <td th:text="${balance.accountName}">現金</td>
            <td th:text="${balance.accountType}">ASSET</td>
            <td th:text="${balance.totalDebit}">1000</td>
            <td th:text="${balance.totalCredit}">2000</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td th:text="|借合計: ${totalDebit}|">借合計:???</td>
            <td th:text="|貸合計: ${totalCredit}|">貸合計:???</td>
        </tr>
        </tfoot>
    </table>

    <a th:href="@{/report/trial-balance.csv(asOfDate=${asOfDate})}">匯出CSV</a>

</div>
</body>
</html>
