<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>新增分錄</title>
</head>
<body>

<h1>新增分錄</h1>

<div th:if="${errorMessage}" style="color:red;">
    <p th:text="${errorMessage}"></p>
</div>

<form th:action="@{/journal-entries}" th:object="${transferForm}" method="post">

    <div th:if="${#fields.hasAnyErrors()}" style="color:red;">
        <ul>
            <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
        </ul>
    </div>

    <div>
        <label>日期：<input type="date" th:field="*{entryDate}"></label>
    </div>

    <div>
        <label>摘要：<input type="text" th:field="*{description}"></label>
    </div>

    <div>
        <label>外部對象（純內部分錄可留空）：<input type="text" th:field="*{externalCounterparty}"></label>
    </div>

    <table>
        <thead>
        <tr>
            <th>科目</th>
            <th>借方金額</th>
            <th>貸方金額</th>
            <th>備註</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="lineRows">
        <tr th:each="line, lineStat : *{lines}">
            <td>
                <select th:field="*{lines[__${lineStat.index}__].accountId}">
                    <option value="">請選擇科目</option>
                    <option th:each="account : ${accounts}"
                            th:value="${account.id}"
                            th:text="${account.code} + ' ' + ${account.name}"></option>
                </select>
            </td>
            <td><input type="number" step="0.01" th:field="*{lines[__${lineStat.index}__].debitAmount}"></td>
            <td><input type="number" step="0.01" th:field="*{lines[__${lineStat.index}__].creditAmount}"></td>
            <td><input type="text" th:field="*{lines[__${lineStat.index}__].memo}"></td>
            <td><button type="button" class="remove-line-btn">刪除</button></td>
        </tr>
        </tbody>
    </table>

    <button type="button" id="add-line-btn">新增一列</button>

    <template id="lineTemplate">
        <tr>
            <td>
                <select name="lines[__INDEX__].accountId">
                    <option value="">請選擇科目</option>
                    <option th:each="account : ${accounts}"
                            th:value="${account.id}"
                            th:text="${account.code} + ' ' + ${account.name}"></option>
                </select>
            </td>
            <td><input type="number" step="0.01" name="lines[__INDEX__].debitAmount" value="0"></td>
            <td><input type="number" step="0.01" name="lines[__INDEX__].creditAmount" value="0"></td>
            <td><input type="text" name="lines[__INDEX__].memo"></td>
            <td><button type="button" class="remove-line-btn">刪除</button></td>
        </tr>
    </template>

    <button type="submit">送出</button>
</form>

<script th:inline="none">
    (function () {
        const tbody = document.getElementById('lineRows');
        const template = document.getElementById('lineTemplate');
        let nextIndex = tbody.querySelectorAll('tr').length;

        document.getElementById('add-line-btn').addEventListener('click', function () {
            const html = template.innerHTML.split('__INDEX__').join(nextIndex);
            tbody.insertAdjacentHTML('beforeend', html);
            nextIndex++;
        });

        // 用事件代理掛在 tbody 上，新增出來的列不用額外重新綁定「刪除」按鈕的事件。
        tbody.addEventListener('click', function (event) {
            if (!event.target.classList.contains('remove-line-btn')) {
                return;
            }
            const rows = tbody.querySelectorAll('tr');
            if (rows.length <= 1) {
                alert('至少要保留一列');
                return;
            }
            event.target.closest('tr').remove();
            reindexLines();
        });

        function reindexLines() {
            const rows = tbody.querySelectorAll('tr');
            rows.forEach(function (row, i) {
                row.querySelectorAll('[name]').forEach(function (el) {
                    el.name = el.name.replace(/lines\[\d+\]/, 'lines[' + i + ']');
                });
            });
            nextIndex = rows.length;
        }
    })();
</script>

</body>
</html>
